name: Build and push image

# Builds upstream indi-allsky's web (gunicorn) image at the commit in
# UPSTREAM_REF, adds expire.sh (Dockerfile), and pushes a versioned tag.
# To upgrade: change UPSTREAM_REF to the commit the camera Pi runs, push,
# then bump the tag in the k8s repo. Keep both sides on the same commit so
# they speak the same SyncAPI.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ennui2342/indi-allsky-web

jobs:
  build:
    # Native arm64: the cluster is all arm64, and the pip install builds
    # native wheels, which is very slow under QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=1.$(date +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Read upstream ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < UPSTREAM_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream indi-allsky
        uses: actions/checkout@v4
        with:
          repository: aaronwmorris/indi-allsky
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream

      - name: Build upstream gunicorn image
        run: |
          docker build \
            -f upstream/docker/Dockerfile.gunicorn \
            --build-arg TZ=Europe/London \
            -t indi-allsky-gunicorn:base \
            upstream

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          docker build \
            --build-arg BASE_IMAGE=indi-allsky-gunicorn:base \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label io.github.aaronwmorris.indi-allsky.revision="$REF" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  # Deploy notification: the "CI deploy notifications" standard in the
  # global Claude Code instructions (reference: ennui2342/opsimath).
  notify:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set — skipping notification"
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            payload=$(jq -n --arg url "$RUN_URL" --arg br "$BRANCH" \
              '{embeds:[{title:"❌ indi-allsky-web build failed",description:("Push to `\($br)` failed — no image pushed. [View logs](\($url))"),color:15158332,footer:{text:"github.com/ennui2342/indi-allsky-web"}}]}')
          else
            payload=$(jq -n --arg tag "$TAG" \
              '{embeds:[{title:"✅ indi-allsky-web deployed",description:"Image tag `\($tag)` pushed — bump it in the k8s repo; Flux will reconcile shortly.",color:3066993,footer:{text:"github.com/ennui2342/indi-allsky-web"}}]}')
          fi
          curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"
